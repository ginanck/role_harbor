---
# defaults file for role_harbor
# Releases: https://github.com/goharbor/harbor/releases

harbor_required_packages:
  - curl
  - wget
  - tar
  - python3-pip
  - python3-docker
  - openssl

harbor_release_version: v2.13.1
harbor_installer_type: online
harbor_installer_file: "harbor-{{ harbor_installer_type }}-installer-{{ harbor_release_version }}.tgz"
harbor_download_url: "https://github.com/goharbor/harbor/releases/download/{{ harbor_release_version }}/{{ harbor_installer_file }}"

harbor_dir: "/opt/harbor"
harbor_data_dir: "{{ harbor_dir }}/data"
harbor_certs_dir: "{{ harbor_dir }}/certs"

harbor_certs: []
  # - http://ca.internal.guru/certs/harbor-cert/harbor-cert.crt
  # - http://ca.internal.guru/certs/harbor-cert/harbor-cert.key

harbor_enable:
  trivy: true
  notary: false
  chartmuseum: false
  clair: false

# Default Harbor configuration
harbor_config:
  # Basic configuration
  hostname: "harbor.internal.guru"

  # HTTP configuration
  http:
    port: 80

  # HTTPS configuration (optional)
  https:
    enabled: false
    port: 443
    # certificate: "{{ harbor_certs_dir }}/harbor-cert.crt"
    # private_key: "{{ harbor_certs_dir }}/harbor-cert.key"
    # strong_ssl_ciphers: false

  # IP family configuration (optional)
  # ip_family:
  #   ipv6:
  #     enabled: false
  #   ipv4:
  #     enabled: true

  # Internal TLS configuration (optional)
  # internal_tls:
  #   enabled: false
  #   dir: "/etc/harbor/tls/internal"

  # External URL (optional)
  # external_url: "https://reg.mydomain.com:8433"

  # Admin password
  harbor_admin_password: "Harbor12345"

  # Database configuration
  database:
    password: "root123"
    max_idle_conns: 100
    max_open_conns: 900
    conn_max_lifetime: "5m"
    conn_max_idle_time: 0

  # Data volume
  data_volume: "{{ harbor_data_dir }}"

  # Storage service configuration (optional)
  # storage_service:
  #   enabled: false
  #   backend: "filesystem"  # Options: filesystem, s3, azure, gcs, swift, oss
  #   filesystem:
  #     maxthreads: 100
  #   redirect:
  #     disable: false

  # Trivy configuration
  trivy:
    ignore_unfixed: false
    skip_update: false
    skip_java_db_update: false
    offline_scan: false
    security_check: "vuln"
    insecure: false
    timeout: "5m0s"
    # github_token: ""  # Optional

  # Job service configuration
  jobservice:
    max_job_workers: 10
    max_job_duration_hours: 24
    job_loggers:
      - "STD_OUTPUT"
      - "FILE"
    logger_sweeper_duration: 1

  # Notification configuration
  notification:
    webhook_job_max_retry: 3
    webhook_job_http_client_timeout: 3

  # Log configuration
  log:
    level: "info"
    local:
      rotate_count: 50
      rotate_size: "200M"
      location: "/var/log/harbor"
    # external_endpoint:  # Optional
    #   protocol: "tcp"
    #   host: "localhost"
    #   port: 5140

  # Version
  _version: "2.13.0"

  # External database configuration (optional)
  # external_database:
  #   harbor:
  #     host: "harbor_db_host"
  #     port: 5432
  #     db_name: "harbor_db_name"
  #     username: "harbor_db_username"
  #     password: "harbor_db_password"
  #     ssl_mode: "disable"
  #     max_idle_conns: 2
  #     max_open_conns: 0

  # Redis configuration (optional)
  # redis:
  #   registry_db_index: 1
  #   jobservice_db_index: 2
  #   trivy_db_index: 5
  #   harbor_db_index: 6
  #   cache_layer_db_index: 7

  # External Redis configuration (optional)
  # external_redis:
  #   host: "redis:6379"
  #   password: ""
  #   username: ""  # Optional
  #   sentinel_master_set: ""  # Optional
  #   tlsOptions:
  #     enable: false
  #     rootCA: ""  # Optional
  #   registry_db_index: 1
  #   jobservice_db_index: 2
  #   trivy_db_index: 5
  #   idle_timeout_seconds: 30
  #   harbor_db_index: 6
  #   cache_layer_db_index: 7

  # UAA configuration (optional)
  # uaa:
  #   ca_file: "/path/to/ca"

  # Proxy configuration
  proxy:
    # http_proxy: ""
    # https_proxy: ""
    # no_proxy: ""
    # components:
    #   - "core"
    #   - "jobservice"
    #   - "trivy"

  # Metrics configuration (optional)
  # metric:
  #   enabled: false
  #   port: 9090
  #   path: "/metrics"

  # Tracing configuration (optional)
  # trace:
  #   enabled: false
  #   sample_rate: 1
  #   namespace: ""
  #   attributes:
  #     application: "harbor"
  #   jaeger:
  #     endpoint: "http://hostname:14268/api/traces"
  #     username: ""
  #     password: ""
  #     agent_host: "hostname"
  #     agent_port: 6831
  #   otel:
  #     endpoint: "hostname:4318"
  #     url_path: "/v1/traces"
  #     compression: false
  #     insecure: true
  #     timeout: 10

  # Upload purging configuration
  upload_purging:
    enabled: true
    age: "168h"
    interval: "24h"
    dryrun: false

  # Cache configuration
  cache:
    enabled: false
    expire_hours: 24

  # Core configuration (optional)
  # core:
  #   quota_update_provider: "db"  # Or "redis"

